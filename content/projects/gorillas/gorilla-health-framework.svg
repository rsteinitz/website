<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">Understanding mountain gorilla health and aging</title>
<desc id="desc">Non-invasive sampling provides complementary physiological indicators. These are integrated over time with observations of health and condition and life-history and environmental context to explore health, aging, and later-life health.</desc>
